<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Color Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b42" />
      <stop offset="50%" stop-color="#061230" />
      <stop offset="100%" stop-color="#02081a" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123a78" />
      <stop offset="100%" stop-color="#071b40" />
    </linearGradient>

    <path id="arcTop" d="M 65,250 A 185,185 0 1,1 435,250" />
    <path id="arcBottom" d="M 435,250 A 185,185 0 0,1 65,250" />
  </defs>

  <!-- Outer Circle Border -->
  <circle cx="250" cy="250" r="242" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="6" />
  <circle cx="250" cy="250" r="234" fill="none" stroke="#2563eb" stroke-width="3" />
  <circle cx="250" cy="250" r="186" fill="url(#ringGrad)" stroke="#60a5fa" stroke-width="4" />
  <circle cx="250" cy="250" r="180" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="2" />

  <!-- Outer Ring Text -->
  <text fill="#ffffff" font-size="21" font-weight="900" font-family="sans-serif" letter-spacing="3.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      ★ ОПЕРАТИВНЕ ★ КРИВИЙ РІГ ★ ОПОВІЩЕННЯ
    </textPath>
  </text>

  <text fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" letter-spacing="3">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      ★ ОПОВІЩЕННЯ ★ KRYVYI RIH ★★
    </textPath>
  </text>

  <!-- Central Shield -->
  <g transform="translate(250,245)">
    <!-- Shield Outer Outline -->
    <path d="M 0 -130 C 50 -130 115 -120 115 -80 L 115 15 C 115 80 50 115 0 135 C -50 115 -115 80 -115 15 L -115 -80 C -115 -120 -50 -130 0 -130 Z"
          fill="#06183b" stroke="#7dd3fc" stroke-width="6" />
    <path d="M 0 -122 C 45 -122 107 -113 107 -76 L 107 12 C 107 72 45 106 0 125 C -45 106 -107 72 -107 12 L -107 -76 C -107 -113 -45 -122 0 -122 Z"
          fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

    <!-- Top Left: Radar Antenna Dish -->
    <g transform="translate(-50, -60)">
      <ellipse cx="0" cy="0" rx="28" ry="18" fill="none" stroke="#7dd3fc" stroke-width="4" transform="rotate(-25)" />
      <ellipse cx="0" cy="0" rx="20" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-25)" />
      <line x1="0" y1="0" x2="-12" y2="-18" stroke="#7dd3fc" stroke-width="3" />
      <circle cx="-12" cy="-18" r="3" fill="#60a5fa" />
      <line x1="0" y1="12" x2="0" y2="28" stroke="#7dd3fc" stroke-width="4" />
      <line x1="-12" y1="28" x2="12" y2="28" stroke="#7dd3fc" stroke-width="4" />
    </g>

    <!-- Top Right: Globe with Grid Mesh -->
    <g transform="translate(52, -52)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#7dd3fc" stroke-width="3.5" />
      <ellipse cx="0" cy="0" rx="32" ry="14" fill="none" stroke="#38bdf8" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="14" ry="32" fill="none" stroke="#38bdf8" stroke-width="2" />
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- Middle Left: Rocket Salvo Tubes Pod -->
    <g transform="translate(-65, 10) rotate(25)">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#0c2d6b" stroke="#7dd3fc" stroke-width="3" />
      <line x1="-11" y1="-12" x2="-11" y2="12" stroke="#7dd3fc" stroke-width="2" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#7dd3fc" stroke-width="2" />
      <line x1="11" y1="-12" x2="11" y2="12" stroke="#7dd3fc" stroke-width="2" />
      <circle cx="-16.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="-5.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="5.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="16.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="-16.5" cy="6" r="3" fill="#38bdf8" />
      <circle cx="-5.5" cy="6" r="3" fill="#38bdf8" />
      <circle cx="5.5" cy="6" r="3" fill="#38bdf8" />
      <circle cx="16.5" cy="6" r="3" fill="#38bdf8" />
    </g>

    <!-- Middle Right: Rocket Salvo Tubes Pod -->
    <g transform="translate(65, 10) rotate(-25)">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#0c2d6b" stroke="#7dd3fc" stroke-width="3" />
      <line x1="-11" y1="-12" x2="-11" y2="12" stroke="#7dd3fc" stroke-width="2" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#7dd3fc" stroke-width="2" />
      <line x1="11" y1="-12" x2="11" y2="12" stroke="#7dd3fc" stroke-width="2" />
      <circle cx="-16.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="-5.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="5.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="16.5" cy="-6" r="3" fill="#38bdf8" />
      <circle cx="-16.5" cy="6" r="3" fill="#38bdf8" />
      <circle cx="-5.5" cy="6" r="3" fill="#38bdf8" />
      <circle cx="5.5" cy="6" r="3" fill="#38bdf8" />
      <circle cx="16.5" cy="6" r="3" fill="#38bdf8" />
    </g>

    <!-- Center Missile / Rocket -->
    <g transform="translate(0, -20)">
      <!-- Missile Tip -->
      <path d="M 0 -85 L 12 -45 L -12 -45 Z" fill="#7dd3fc" stroke="#e0f2fe" stroke-width="2" />
      <!-- Missile Body -->
      <rect x="-12" y="-45" width="24" height="85" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2" />
      <line x1="0" y1="-45" x2="0" y2="40" stroke="#0284c7" stroke-width="2" />
      <!-- Top Fins -->
      <path d="M -12 -30 L -22 -15 L -12 -15 Z" fill="#0284c7" />
      <path d="M 12 -30 L 22 -15 L 12 -15 Z" fill="#0284c7" />
      <!-- Bottom Fins -->
      <path d="M -12 20 L -26 40 L -12 40 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5" />
      <path d="M 12 20 L 26 40 L 12 40 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5" />
    </g>

    <!-- Chevron Banner at Shield Bottom: АЛЕРТС -->
    <g transform="translate(0, 68)">
      <rect x="-62" y="-18" width="124" height="36" rx="8" fill="#0284c7" stroke="#e0f2fe" stroke-width="3" />
      <text x="0" y="7" fill="#ffffff" font-size="21" font-weight="900" font-family="sans-serif" letter-spacing="3.5" text-anchor="middle">
        АЛЕРТС
      </text>
    </g>
  </g>
</svg>
